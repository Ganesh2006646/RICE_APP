name: rice_agent
description: Agent app for rice-mill orders
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  http: ^1.1.2
  intl: ^0.19.0
  lottie: ^3.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  excel: ^4.0.6
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  uuid: ^4.5.1
  file_picker: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.14.0
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/sri_balaji_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sri_balaji_logo.png"
